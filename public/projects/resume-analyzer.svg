<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14141A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="meterGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="windowBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#27272A" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Grid overlay -->
  <g opacity="0.12" stroke="#27272A" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" /><line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" /><line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" /><line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" /><line x1="0" y1="400" x2="800" y2="400" />
    <line x1="100" y1="0" x2="100" y2="500" /><line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" /><line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" /><line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
  </g>

  <!-- Browser Frame -->
  <rect x="50" y="40" width="700" height="420" rx="14" fill="#111113" stroke="url(#windowBorder)" stroke-width="1.5" />
  
  <!-- Browser Chrome / URL Bar -->
  <rect x="50" y="40" width="700" height="44" rx="14" fill="#18181B" />
  <circle cx="78" cy="62" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="94" cy="62" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="110" cy="62" r="5" fill="#10B981" opacity="0.8" />

  <!-- URL input -->
  <rect x="140" y="52" width="520" height="22" rx="6" fill="#111113" stroke="#27272A" />
  <text x="400" y="67" fill="#A1A1AA" font-family="monospace" font-size="11" text-anchor="middle">
    https://resume-ai.vinayakk.dev/analyze/staff-ai-engineer
  </text>

  <!-- Left: Upload & Resume Preview Pane -->
  <rect x="75" y="105" width="280" height="330" rx="10" fill="#141418" stroke="#27272A" />
  <text x="95" y="132" fill="#FAFAFA" font-family="sans-serif" font-size="13" font-weight="700">Senior AI Systems Resume.pdf</text>
  <text x="95" y="148" fill="#71717A" font-family="monospace" font-size="10">Target: Senior Staff AI Platform Lead</text>

  <!-- Resume skeleton lines with highlights -->
  <rect x="95" y="170" width="180" height="8" rx="2" fill="#27272A" />
  <rect x="95" y="185" width="240" height="6" rx="2" fill="#1F1F24" />
  <rect x="95" y="197" width="210" height="6" rx="2" fill="#1F1F24" />

  <!-- Matched Skills Pills -->
  <text x="95" y="235" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700">EXTRACTED CORE CAPABILITIES</text>
  <rect x="95" y="250" width="75" height="20" rx="4" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.4" />
  <text x="132" y="264" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">LangGraph</text>

  <rect x="176" y="250" width="65" height="20" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" />
  <text x="208" y="264" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">FastAPI</text>

  <rect x="247" y="250" width="85" height="20" rx="4" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.4" />
  <text x="289" y="264" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">Vector DBs</text>

  <rect x="95" y="278" width="95" height="20" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" />
  <text x="142" y="292" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">TypeScript</text>

  <rect x="196" y="278" width="80" height="20" rx="4" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.4" />
  <text x="236" y="292" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">Next.js</text>

  <!-- Missing Skill Warning -->
  <rect x="95" y="325" width="240" height="90" rx="8" fill="#1C1819" stroke="#EF4444" stroke-opacity="0.4" />
  <text x="110" y="348" fill="#F87171" font-family="sans-serif" font-size="11" font-weight="700">Missing Keyword Alert</text>
  <text x="110" y="368" fill="#A1A1AA" font-family="sans-serif" font-size="10">Job requires "Distributed Caching (Redis)".</text>
  <text x="110" y="390" fill="#38BDF8" font-family="monospace" font-size="10">💡 One-click AI rewrite suggested</text>

  <!-- Right: Score & Optimization Dashboard -->
  <rect x="375" y="105" width="350" height="330" rx="10" fill="#141418" stroke="#27272A" />

  <!-- ATS Score Circle -->
  <text x="395" y="132" fill="#FAFAFA" font-family="sans-serif" font-size="13" font-weight="700">ATS Match Breakdown</text>
  
  <rect x="395" y="155" width="310" height="85" rx="8" fill="#191920" stroke="#27272A" />
  <text x="415" y="195" fill="#10B981" font-family="monospace" font-size="34" font-weight="800">94<tspan font-size="18" fill="#A1A1AA">/100</tspan></text>
  <text x="510" y="180" fill="#FAFAFA" font-family="sans-serif" font-size="12" font-weight="600">Exceptional ATS Alignment</text>
  <text x="510" y="198" fill="#A1A1AA" font-family="sans-serif" font-size="11">Exceeds 92% of target applicants</text>
  <rect x="510" y="210" width="175" height="6" rx="3" fill="#27272A" />
  <rect x="510" y="210" width="164" height="6" rx="3" fill="url(#meterGrad)" />

  <!-- Section Feedback Cards -->
  <rect x="395" y="255" width="310" height="52" rx="6" fill="#181820" stroke="#27272A" />
  <text x="410" y="275" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">✓ Quantification</text>
  <text x="410" y="293" fill="#A1A1AA" font-family="sans-serif" font-size="10">8 metrics detected with concrete business revenue impact.</text>

  <rect x="395" y="318" width="310" height="52" rx="6" fill="#181820" stroke="#27272A" />
  <text x="410" y="338" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">✓ Leadership &amp; Architecture</text>
  <text x="410" y="356" fill="#A1A1AA" font-family="sans-serif" font-size="10">Strong action verbs: Architected, Orchestrated, Synthesized.</text>

  <!-- CTA Action -->
  <rect x="395" y="380" width="310" height="38" rx="8" fill="#38BDF8" />
  <text x="550" y="404" fill="#09090B" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Export Tailored PDF &amp; Cover Letter →</text>
</svg>
