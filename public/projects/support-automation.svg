<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#27272A" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Flow Grid Pattern -->
  <g opacity="0.12" stroke="#27272A" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
  </g>

  <!-- n8n Workflow Window -->
  <rect x="50" y="40" width="700" height="420" rx="14" fill="#111113" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="50" y="40" width="700" height="42" rx="14" fill="#18181B" />
  <circle cx="80" cy="61" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="96" cy="61" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="112" cy="61" r="5" fill="#10B981" opacity="0.8" />
  <text x="400" y="65" fill="#A1A1AA" font-family="monospace" font-size="12" text-anchor="middle" font-weight="600">
    n8n Workflow Engine · AI Email Triage &amp; Ticket Routing Pipeline
  </text>
  <rect x="640" y="52" width="90" height="20" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" />
  <text x="685" y="66" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle" font-weight="700">● ACTIVE</text>

  <!-- Connecting Bézier Curves with glowing pulses -->
  <path d="M 180 230 C 230 230, 240 230, 290 230" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M 430 230 C 470 230, 480 180, 520 180" stroke="#38BDF8" stroke-width="2" fill="none" stroke-dasharray="4,4" opacity="0.7" />
  <path d="M 430 230 C 470 230, 480 280, 520 280" stroke="#10B981" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 640 180 C 670 180, 680 210, 700 220" stroke="#A1A1AA" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M 640 280 C 670 280, 680 250, 700 240" stroke="#A1A1AA" stroke-width="1.5" fill="none" opacity="0.4" />

  <!-- Node 1: Gmail Trigger -->
  <rect x="80" y="190" width="100" height="80" rx="10" fill="#18181E" stroke="#EA4335" stroke-width="1.5" />
  <circle cx="130" cy="220" r="14" fill="#EA4335" fill-opacity="0.2" />
  <text x="130" y="225" fill="#FAFAFA" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="700">✉</text>
  <text x="130" y="250" fill="#FAFAFA" font-family="monospace" font-size="10" text-anchor="middle" font-weight="600">Gmail Webhook</text>
  <text x="130" y="262" fill="#71717A" font-family="monospace" font-size="9" text-anchor="middle">Inbound Email</text>

  <!-- Node 2: OpenAI Intent Extraction -->
  <rect x="290" y="180" width="140" height="100" rx="10" fill="#18181E" stroke="#38BDF8" stroke-width="2" filter="drop-shadow(0 0 10px rgba(56,189,248,0.2))" />
  <circle cx="360" cy="215" r="16" fill="#38BDF8" fill-opacity="0.2" />
  <text x="360" y="221" fill="#38BDF8" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="700">⚡</text>
  <text x="360" y="248" fill="#FAFAFA" font-family="monospace" font-size="11" text-anchor="middle" font-weight="700">OpenAI GPT-4o</text>
  <text x="360" y="262" fill="#A1A1AA" font-family="monospace" font-size="9" text-anchor="middle">Intent + Entity Classify</text>

  <!-- Node 3A: PostgreSQL Customer DB Verification -->
  <rect x="520" y="140" width="120" height="80" rx="10" fill="#18181E" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="580" cy="170" r="12" fill="#38BDF8" fill-opacity="0.2" />
  <text x="580" y="175" fill="#38BDF8" font-family="sans-serif" font-size="12" text-anchor="middle">🗄</text>
  <text x="580" y="198" fill="#FAFAFA" font-family="monospace" font-size="10" text-anchor="middle" font-weight="600">PostgreSQL DB</text>
  <text x="580" y="210" fill="#71717A" font-family="monospace" font-size="9" text-anchor="middle">Verify Sub Tier</text>

  <!-- Node 3B: Auto-Draft & Routing -->
  <rect x="520" y="240" width="120" height="80" rx="10" fill="#18181E" stroke="#10B981" stroke-width="1.5" />
  <circle cx="580" cy="270" r="12" fill="#10B981" fill-opacity="0.2" />
  <text x="580" y="275" fill="#10B981" font-family="sans-serif" font-size="12" text-anchor="middle">✓</text>
  <text x="580" y="298" fill="#FAFAFA" font-family="monospace" font-size="10" text-anchor="middle" font-weight="600">Auto Response</text>
  <text x="580" y="310" fill="#10B981" font-family="monospace" font-size="9" text-anchor="middle">Slack Escalation</text>

  <!-- Metrics Bar at Bottom -->
  <rect x="80" y="360" width="640" height="65" rx="8" fill="#141418" stroke="#27272A" />
  <g font-family="monospace">
    <text x="120" y="388" fill="#38BDF8" font-size="18" font-weight="700">&lt; 15s</text>
    <text x="120" y="408" fill="#A1A1AA" font-size="10">End-to-End Triage</text>

    <text x="280" y="388" fill="#10B981" font-size="18" font-weight="700">65%</text>
    <text x="280" y="408" fill="#A1A1AA" font-size="10">Auto-Resolved</text>

    <text x="440" y="388" fill="#FAFAFA" font-size="18" font-weight="700">Zero</text>
    <text x="440" y="408" fill="#A1A1AA" font-size="10">Manual Data Entry</text>

    <text x="600" y="388" fill="#F59E0B" font-size="18" font-weight="700">HITL</text>
    <text x="600" y="408" fill="#A1A1AA" font-size="10">Human-In-Loop Safe</text>
  </g>
</svg>
