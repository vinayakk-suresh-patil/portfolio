<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="darkBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181715" />
      <stop offset="50%" stop-color="#121110" />
      <stop offset="100%" stop-color="#0D0C0B" />
    </linearGradient>

    <!-- n8n Coral Red-Orange Gradient -->
    <linearGradient id="n8nGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6D5A" />
      <stop offset="60%" stop-color="#EA4B71" />
      <stop offset="100%" stop-color="#D8335D" />
    </linearGradient>

    <!-- Ambient Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#EA4B71" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#EA4B71" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#121110" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04" />
    </pattern>

    <!-- Card Inner Border Gradient -->
    <linearGradient id="frameBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#EA4B71" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#EA4B71" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#darkBg)" />

  <!-- Ambient Glow -->
  <rect width="1200" height="750" fill="url(#centerGlow)" />

  <!-- Architectural Dot Grid -->
  <rect width="1200" height="750" fill="url(#dotPattern)" opacity="0.8" />

  <!-- Minimalist Structural Hairline Frame -->
  <rect x="50" y="50" width="1100" height="650" rx="16" fill="none" stroke="url(#frameBorder)" stroke-width="1.2" opacity="0.6" />

  <!-- Corner Precision Accents -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#EA4B71" stroke-width="2" opacity="0.75" />
  <path d="M 1160 70 L 1160 40 L 1130 40" fill="none" stroke="#EA4B71" stroke-width="2" opacity="0.75" />
  <path d="M 40 680 L 40 710 L 70 710" fill="none" stroke="#EA4B71" stroke-width="2" opacity="0.75" />
  <path d="M 1160 680 L 1160 710 L 1130 710" fill="none" stroke="#EA4B71" stroke-width="2" opacity="0.75" />

  <!-- Header Metadata Line inside Frame -->
  <g font-family="'Geist Mono', monospace, ui-monospace" font-size="11" letter-spacing="0.22em" text-transform="uppercase">
    <text x="80" y="90" fill="#A89F91" font-weight="600">01 // AUTOMATION ENGINE</text>
    <text x="1120" y="90" fill="#EA4B71" font-weight="700" text-anchor="end">● ACTIVE WORKFLOW</text>
  </g>

  <!-- Central Visual Unit: n8n Node Logo + Brand Wordmark -->
  <g id="n8nBrandCenter">
    <!-- Concentric Technical Pulse Ring -->
    <circle cx="600" cy="310" r="110" fill="none" stroke="#EA4B71" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="6 6" />
    <circle cx="600" cy="310" r="85" fill="none" stroke="#EA4B71" stroke-width="1" stroke-opacity="0.28" />

    <!-- Official n8n Connected Node Symbol (Scaled up from 24x24 viewBox) -->
    <!-- Original width=24, height=24. Scale factor = 6.4 (153.6px width). Centered at X=600 - 76.8 = 523.2, Y=310 - 76.8 = 233.2 -->
    <g transform="translate(523.2, 233.2) scale(6.4)" filter="url(#logoShadow)">
      <path
        d="M21.4737 5.6842c-1.1772 0-2.1663.8051-2.4468 1.8947h-2.8955c-1.235 0-2.289.893-2.492 2.111l-.1038.623a1.263 1.263 0 0 1-1.246 1.0555H11.289c-.2805-1.0896-1.2696-1.8947-2.4468-1.8947s-2.1663.8051-2.4467 1.8947H4.973c-.2805-1.0896-1.2696-1.8947-2.4468-1.8947C1.1311 9.4737 0 10.6047 0 12s1.131 2.5263 2.5263 2.5263c1.1772 0 2.1663-.8051 2.4468-1.8947h1.4223c.2804 1.0896 1.2696 1.8947 2.4467 1.8947 1.1772 0 2.1663-.8051 2.4468-1.8947h1.0008a1.263 1.263 0 0 1 1.2459 1.0555l.1038.623c.203 1.218 1.257 2.111 2.492 2.111h.3692c.2804 1.0895 1.2696 1.8947 2.4468 1.8947 1.3952 0 2.5263-1.131 2.5263-2.5263s-1.131-2.5263-2.5263-2.5263c-1.1772 0-2.1664.805-2.4468 1.8947h-.3692a1.263 1.263 0 0 1-1.246-1.0555l-.1037-.623A2.52 2.52 0 0 0 13.9607 12a2.52 2.52 0 0 0 .821-1.4794l.1038-.623a1.263 1.263 0 0 1 1.2459-1.0555h2.8955c.2805 1.0896 1.2696 1.8947 2.4468 1.8947 1.3952 0 2.5263-1.131 2.5263-2.5263s-1.131-2.5263-2.5263-2.5263m0 1.2632a1.263 1.263 0 0 1 1.2631 1.2631 1.263 1.263 0 0 1-1.2631 1.2632 1.263 1.263 0 0 1-1.2632-1.2632 1.263 1.263 0 0 1 1.2632-1.2631M2.5263 10.7368A1.263 1.263 0 0 1 3.7895 12a1.263 1.263 0 0 1-1.2632 1.2632A1.263 1.263 0 0 1 1.2632 12a1.263 1.263 0 0 1 1.2631-1.2632m6.3158 0A1.263 1.263 0 0 1 10.1053 12a1.263 1.263 0 0 1-1.2632 1.2632A1.263 1.263 0 0 1 7.579 12a1.263 1.263 0 0 1 1.2632-1.2632m10.1053 3.7895a1.263 1.263 0 0 1 1.2631 1.2632 1.263 1.263 0 0 1-1.2631 1.2631 1.263 1.263 0 0 1-1.2632-1.2631 1.263 1.263 0 0 1 1.2632-1.2632"
        fill="url(#n8nGradient)"
      />
    </g>

    <!-- n8n Brand Name Wordmark -->
    <text
      x="600"
      y="470"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="64"
      font-weight="800"
      fill="#F8F4EA"
      text-anchor="middle"
      letter-spacing="-0.04em"
    >
      n8n
    </text>

    <!-- Subtitle: Workflow Automation -->
    <text
      x="600"
      y="508"
      font-family="'Geist Mono', monospace, ui-monospace"
      font-size="13"
      font-weight="600"
      fill="#EA4B71"
      text-anchor="middle"
      letter-spacing="0.32em"
    >
      WORKFLOW AUTOMATION
    </text>
  </g>

  <!-- Bottom Technical Details Bar -->
  <g font-family="'Geist Mono', monospace, ui-monospace" font-size="10" letter-spacing="0.18em" fill="#716A62">
    <text x="80" y="660">MULTI-AGENT ORCHESTRATION · WEBHOOK TRIGGERS · DETERMINISTIC APIS</text>
    <text x="1120" y="660" text-anchor="end">PRODUCTION GRADE</text>
  </g>
</svg>
